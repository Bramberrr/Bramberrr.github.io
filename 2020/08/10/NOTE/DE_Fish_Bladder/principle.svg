<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">How a dielectric elastomer actuator works</title>
  <desc id="d">Left: with the voltage off, a soft dielectric elastomer film sits between two compliant electrodes. Right: with the voltage on, opposite charges on the electrodes attract each other, squeezing the film so it gets thinner and spreads out in area.</desc>
  <rect width="900" height="310" fill="#ffffff"/>

  <!-- OFF -->
  <text x="210" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1d2430">Voltage off</text>
  <rect x="100" y="130" width="220" height="8" fill="#222"/>
  <rect x="100" y="138" width="220" height="44" fill="#c9ccd1"/>
  <rect x="100" y="182" width="220" height="8" fill="#222"/>
  <path d="M210,130 V80 H360 V140 M360,180 V240 H210 V190" fill="none" stroke="#444" stroke-width="2"/>
  <line x1="360" y1="140" x2="378" y2="168" stroke="#444" stroke-width="2"/>
  <text x="386" y="160" font-size="14" fill="#545b66">open</text>
  <text x="92" y="139" text-anchor="end" font-size="14" fill="#1d2430">electrode</text>
  <text x="92" y="165" text-anchor="end" font-size="14" fill="#1d2430">elastomer</text>
  <text x="92" y="191" text-anchor="end" font-size="14" fill="#1d2430">electrode</text>

  <!-- ON -->
  <text x="680" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1d2430">Voltage on</text>
  <rect x="530" y="148" width="300" height="8" fill="#222"/>
  <rect x="530" y="156" width="300" height="20" fill="#c9ccd1"/>
  <rect x="530" y="176" width="300" height="8" fill="#222"/>
  <path d="M680,148 V80 H860 V150 M860,166 V240 H680 V184" fill="none" stroke="#444" stroke-width="2"/>
  <line x1="846" y1="150" x2="874" y2="150" stroke="#444" stroke-width="3"/>
  <line x1="852" y1="166" x2="868" y2="166" stroke="#444" stroke-width="3"/>
  <text x="880" y="146" font-size="14" fill="#545b66">+</text>
  <!-- squeeze arrows (vertical, pointing at the film) -->
  <g fill="#1f5fa8" stroke="#1f5fa8" stroke-width="3">
    <line x1="610" y1="96" x2="610" y2="130"/><polygon points="602,128 618,128 610,142" stroke="none"/>
    <line x1="610" y1="232" x2="610" y2="198"/><polygon points="602,200 618,200 610,186" stroke="none"/>
    <!-- spread arrows (horizontal, pointing outward) -->
    <line x1="526" y1="166" x2="494" y2="166"/><polygon points="496,158 496,174 482,166" stroke="none"/>
  </g>
  <text x="530" y="280" font-size="14" fill="#1d2430">Opposite charges attract (Maxwell pressure),</text>
  <text x="530" y="298" font-size="14" fill="#1d2430">so the film gets thinner and its area grows.</text>
</svg>
